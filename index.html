<style>
:root{
  --bg:#0b1020;--panel:#131a2e;--panel2:#1a2340;--line:#27325a;--text:#e8ecf8;--mute:#98a2c3;
  --vlm:#a78bfa;--vla:#38bdf8;--wm:#34d399;--omni:#fbbf24;--acc:#7dd3fc;--warn:#fb923c;
  --r:14px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f4f6fc;--panel:#fff;--panel2:#eef1fb;--line:#d5dbf0;--text:#141a33;--mute:#5a6586;--acc:#0369a1}
}
:root[data-theme="light"]{--bg:#f4f6fc;--panel:#fff;--panel2:#eef1fb;--line:#d5dbf0;--text:#141a33;--mute:#5a6586;--acc:#0369a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 0}
.top{display:flex;gap:10px;align-items:center}
.logo{font:700 18px/1 Georgia,serif;color:var(--acc);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
h1{font-size:15px;margin:0;line-height:1.2;flex:1}
h1 small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.search{flex:1.2;min-width:0}
input[type=search],input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;font-size:15px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;color:var(--mute);font:inherit;font-size:14px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--text);border-color:var(--acc)}
main{max-width:920px;margin:0 auto;padding:16px 16px 40px}
h2{font-size:22px;margin:4px 0 6px}
p.lead{color:var(--mute);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid currentColor;margin-right:4px}
.t-VLM{color:var(--vlm)}.t-VLA{color:var(--vla)}.t-WM{color:var(--wm)}.t-Omni{color:var(--omni)}
button.btn,.chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
button.btn:hover,.chip:hover{border-color:var(--acc)}
.chip[aria-pressed=true]{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.mute{color:var(--mute)}.small{font-size:13px}
a{color:var(--acc)}
/* ladder */
.ladder{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--text);font:inherit;cursor:pointer}
.step[aria-expanded=true]{border-color:var(--acc);background:var(--panel2)}
.step .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.step b{display:block}
.step .more{display:none;margin-top:8px}
.step[aria-expanded=true] .more{display:block}
.io{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}
.io div.b{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.io .arr{color:var(--acc);font-size:18px}
/* model card */
.mc h3{margin:0 0 2px;font-size:18px}
.mc .org{color:var(--mute);font-size:13px;margin-bottom:8px}
.flow{display:grid;gap:6px;margin:10px 0;font-size:13.5px}
.flow div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.flow b{color:var(--acc);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block}
.src{font-size:12.5px}
.badge{font-size:11px;color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.badge.ok{color:var(--wm);border-color:var(--wm)}
/* compare */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:var(--panel2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--mute);width:110px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.hl{background:color-mix(in srgb,var(--acc) 10%,transparent)}
/* demo */
.stage{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.pill{flex:1;min-width:92px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;font-size:12.5px;opacity:.5;transition:.25s}
.pill .e{font-size:22px;display:block}
.pill.on{opacity:1;border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.pill.done{opacity:.95}
.pill.skip{opacity:.25;text-decoration:line-through}
.caption{min-height:3.2em;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
svg.scene{width:100%;height:auto;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r)}
.obj{transition:transform .9s ease-in-out}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#04121f;font-weight:600}
/* timeline */
.tl{position:relative;margin-left:10px;padding-left:20px;border-left:2px solid var(--line)}
.tl .it{position:relative;margin-bottom:14px}
.tl .it::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.tl .d{font-size:12px;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:18px 16px 28px;text-align:center;color:var(--mute);font-size:12.5px}
.hidden{display:none!important}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){.obj,.pill{transition:none}}
</style>
</head>

var OBJS={
  cup:{label:"red cup",x:80,y:150,w:34,h:34,c:"#ef4444",shape:"c",words:["cup","mug"]},
  bottle:{label:"blue bottle",x:150,y:235,w:22,h:50,c:"#3b82f6",shape:"r",words:["bottle"]},

  laptop:{label:"laptop",x:300,y:200,w:90,h:62,c:"#94a3b8",shape:"r",words:["laptop","computer"]},
  book:{label:"book",x:70,y:62,w:50,h:36,c:"#f59e0b",shape:"r",words:["book"]}
};
var DEMO_HOME={};
function parseInstruction(txt){
  var t=" "+txt.toLowerCase()+" ";
  var found=[];
  Object.keys(OBJS).forEach(function(k){OBJS[k].words.forEach(function(w){var i=t.indexOf(w);if(i>-1)found.push({k:k,i:i})})});
  found.sort(function(a,b){return a.i-b.i});
  var uniq=[];found.forEach(function(f){if(!uniq.some(function(u){return u.k===f.k}))uniq.push(f)});
  var verb=/push|slide|nudge/.test(t)?"push":/pick|put|place|move|bring|set/.test(t)?"place":"";
  var rel=/beside|next to|near|by /.test(t)?"beside":/ on /.test(t)?"on":/ in front/.test(t)?"front":"beside";
  if(!verb)return {err:"I don't see an action verb. Try “pick up…”, “put…” or “push…”."};
  if(uniq.length<2)return {err:"Name two things from the table: "+Object.keys(OBJS).map(function(k){return OBJS[k].label}).join(", ")+"."};
  if(uniq[0].k===uniq[1].k)return {err:"Pick two different objects."};
  return {verb:verb,obj:uniq[0].k,dest:uniq[1].k,rel:rel};
}
function destPoint(p){
  var d=OBJS[p.dest],o=OBJS[p.obj];
  if(p.rel==="on")return {x:d.x,y:d.y-d.h/2-o.h/2+4};
  if(p.rel==="front")return {x:d.x,y:Math.min(d.y+d.h/2+o.h/2+14,285)};
  var side=d.x>200?-1:1; // put on the roomier side
  return {x:d.x+side*(d.w/2+o.w/2+16),y:d.y};
}
function sceneSvg(){
  var s='<svg class="scene" id="scene" viewBox="0 0 400 300" role="img" aria-label="Top-down view of a table with a red cup, blue bottle, green block, laptop and book">'+
  '<rect x="6" y="6" width="388" height="288" rx="14" fill="none" stroke="var(--line)" stroke-dasharray="4 5"/><text x="14" y="22" font-size="10" fill="var(--mute)">top-down view of the table</text>';
  s+='<g id="ghost" opacity="0"></g>';
  Object.keys(OBJS).forEach(function(k){
    var o=OBJS[k];
    var shape=o.shape==="c"?'<circle r="'+(o.w/2)+'" fill="'+o.c+'"/>':'<rect x="'+(-o.w/2)+'" y="'+(-o.h/2)+'" width="'+o.w+'" height="'+o.h+'" rx="5" fill="'+o.c+'"/>';
    s+='<g class="obj" id="o-'+k+'" style="transform:translate('+o.x+'px,'+o.y+'px)">'+shape+'<text y="'+(o.h/2+12)+'" text-anchor="middle" font-size="9.5" fill="var(--text)">'+o.label+'</text></g>';
  });
  s+='<g class="obj" id="gripper" style="transform:translate(200px,280px)"><circle r="9" fill="none" stroke="var(--acc)" stroke-width="3"/><path d="M-14 -4 L-9 0 M14 -4 L9 0" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/></g></svg>';
  return s;
}

function resetScene(){
  Object.keys(OBJS).forEach(function(k){setObj("o-"+k,OBJS[k].x,OBJS[k].y)});

function runDemo(){
  clearDemo();resetScene();
  var cap=$("#cap"),pills=$$(".pill");
  pills.forEach(function(p){p.className="pill"});
  var p=parseInstruction($("#instr").value);
  if(p.err){cap.textContent="⚠ "+p.err;return}
  var useWM=S.demoMode==="wm";
  var o=OBJS[p.obj],d=OBJS[p.dest],dp=destPoint(p);
  var mark=function(i,txt,ms){later(function(){pills.forEach(function(q,j){q.classList.remove("on");if(j<i&&!q.classList.contains("skip"))q.classList.add("done")});pills[i].classList.add("on");cap.textContent=txt},ms)};
  if(!useWM)pills[2].classList.add("skip");
  var t=0;
  mark(0,"👁️ Camera: the robot receives an image of the table and your sentence.",t);t+=1500;
  mark(1,"🧠 Understand: “"+o.label+"” is the thing to move; “"+d.label+"” is the reference. Action: "+(p.verb==="push"?"push it along the table":"grasp, lift, set down")+" "+(p.rel==="on"?"on top of":p.rel==="front"?"in front of":"beside")+" the "+d.label+".",t);t+=2000;
  if(useWM){
    mark(2,"🌎 Predict: the world model imagines the end state — the "+o.label+" ends up here (dashed). It also checks the path for collisions before moving.",t);
    later(function(){var g=document.getElementById("ghost");g.setAttribute("opacity","0.9");
      g.innerHTML='<circle cx="'+dp.x+'" cy="'+dp.y+'" r="'+Math.max(o.w,o.h)/2+'" fill="none" stroke="var(--wm)" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="'+o.x+'" y1="'+o.y+'" x2="'+dp.x+'" y2="'+dp.y+'" stroke="var(--wm)" stroke-dasharray="3 5" stroke-width="1.5"/>'},t+300);
    t+=2200;
  }else{
    later(function(){pills[2].classList.add("skip")},t);
  }
  mark(3,"🗺️ Plan: "+(p.verb==="push"?"move the gripper behind the "+o.label+", then push toward the target.":"1) reach the "+o.label+"  2) close gripper  3) lift  4) carry  5) place  6) open gripper.")+(useWM?" Plan was checked against the imagined future.":" (Without a world model, the policy commits directly from what it sees.)"),t);t+=2000;
  mark(4,"🤖 Act: sending motor commands…",t);
  var gp=p.verb==="push"?{x:o.x-(dp.x>o.x?1:-1)*(o.w/2+14),y:o.y}:{x:o.x,y:o.y};
  later(function(){setObj("gripper",gp.x,gp.y)},t+100);
  later(function(){setObj("gripper",dp.x,dp.y);setObj("o-"+p.obj,dp.x,dp.y)},t+1300);
  later(function(){cap.textContent="✅ Done. The "+o.label+" is now "+(p.rel==="on"?"on the "+d.label:p.rel==="front"?"in front of the "+d.label:"beside the "+d.label)+". In a real system, a camera check would close the loop and the robot could learn from the result.";pills.forEach(function(q){if(!q.classList.contains("skip"))q.classList.add("done");q.classList.remove("on")})},t+2600);
}
